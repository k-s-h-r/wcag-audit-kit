<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Control availability regression</title><style>button{color:#111;background:white;border:2px solid #333;padding:10px} [hidden]{display:none}</style></head>
<body><main><h1>Control availability</h1>
<button type="button" id="enable">Enable details</button>
<button type="button" id="open" aria-disabled="true">Open details</button>
<p id="details" hidden>The newly enabled control opens this content.</p>
<script>
document.querySelector('#enable').onclick=()=>document.querySelector('#open').removeAttribute('aria-disabled');
document.querySelector('#open').onclick=()=>{if(!document.querySelector('#open').hasAttribute('aria-disabled'))document.querySelector('#details').hidden=false};
</script></main></body></html>
