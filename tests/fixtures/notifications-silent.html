<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Silent save notification — screen reader fixture</title></head>
<body>
<main>
  <h1>Screen reader notification fixture</h1>
  <button id="save" type="button">Save</button>
  <p id="status"></p>
</main>
<script>
document.querySelector('#save').addEventListener('click', () => {
  document.querySelector('#status').textContent = 'Saved successfully.';
});
</script>
</body>
</html>
