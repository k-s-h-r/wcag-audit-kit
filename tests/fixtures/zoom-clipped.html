<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Lost action on zoom — negative fixture</title>
  <style>
    body { font: 16px/1.6 sans-serif; margin: 24px; color: #222; background: white; }
    @media (max-width: 800px) { #download { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1>Download your receipt</h1>
    <p>The download action must remain available when text is enlarged.</p>
    <a id="download" href="data:text/plain,Receipt" download="receipt.txt">Download receipt</a>
  </main>
</body>
</html>
