<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><label>下書き<textarea id="subject"></textarea></label><button id="save">下書きを保存</button><p id="state"></p><script>const name="wcag-long-retention";function restore(){const r=JSON.parse(localStorage.getItem(name)||"null");if(r&&Date.now()<r.until){subject.value=r.value;document.querySelector("#state").textContent="保存済み"}else{subject.value="";localStorage.removeItem(name)}}save.onclick=()=>localStorage.setItem(name,JSON.stringify({value:subject.value,until:Date.now()+12*3600000}));restore()</script></main></body></html>
