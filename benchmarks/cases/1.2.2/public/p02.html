<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>案内動画</title><link rel="stylesheet" href="assets/site.css"></head><body><main><h1>案内動画</h1><p>再生し、字幕を有効にして確認してください。</p><video id="media" preload="auto"><source src="assets/clip.webm" type="video/webm"><track kind="captions" src="assets/captions.vtt" srclang="en" label="English"></video><button id="play" type="button">再生する</button><button id="captions" type="button" aria-pressed="false">字幕</button></main><script>const v=document.querySelector('#media');document.querySelector('#play').onclick=()=>v.paused?v.play():v.pause();document.querySelector('#captions').onclick=e=>{const showing=e.target.getAttribute('aria-pressed')!=='true';e.target.setAttribute('aria-pressed',String(showing));v.textTracks[0].mode='hidden'}</script></body></html>
