<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><button id="before">前の操作</button><div id="subject"></div><button id="after">次の操作</button><script>const shadow=subject.attachShadow({mode:"open"});shadow.innerHTML='<div id="inner-action" role="button" tabindex="0" aria-expanded="false" aria-controls="inner-panel">詳細</div><p id="inner-panel" hidden>料金は1000円です</p>';const control=shadow.querySelector("#inner-action"),panel=shadow.querySelector("#inner-panel");control.onclick=()=>{panel.hidden=!panel.hidden;control.setAttribute("aria-expanded",String(!panel.hidden));}</script></main></body></html>
