<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><div id="subject"><div role="tablist" aria-label="製品案内"><button id="tab-a" role="tab" aria-selected="true" aria-controls="panel-a">概要</button><div id="tab-b" role="tab" tabindex="-1" aria-selected="false" aria-controls="panel-b">料金</div></div><div id="panel-a" role="tabpanel" aria-labelledby="tab-a">概要の説明</div><div id="panel-b" role="tabpanel" aria-labelledby="tab-b" hidden>料金は1000円</div></div><script>const a=document.querySelector("#tab-a"),b=document.querySelector("#tab-b"),pa=document.querySelector("#panel-a"),pb=document.querySelector("#panel-b");function showB(){pa.hidden=true;pb.hidden=false;a.setAttribute("aria-selected","false");b.setAttribute("aria-selected","true");}a.onkeydown=e=>{if(e.key==="ArrowRight"){e.preventDefault();b.focus();}};b.onclick=showB;</script></main></body></html>
