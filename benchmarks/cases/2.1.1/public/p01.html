<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>数量の変更</title><link rel="stylesheet" href="assets/site.css"></head><body><main><h1>数量の変更</h1><p>数量を増やしてください。</p><button id="control" type="button">数量を増やす</button><p>数量：<output id="counter">0</output></p></main><script>document.querySelector('#control').onclick=()=>document.querySelector('#counter').textContent=String(Number(document.querySelector('#counter').textContent)+1)</script></body></html>
