<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><button id="show">通知を表示</button><button id="subject" style="position:fixed;left:30px;bottom:160px;height:44px">保存</button><aside id="banner" hidden style="position:fixed;inset:auto 0 0;height:120px;background:#eee;z-index:4;border-top:2px solid #333">利用条件のお知らせ<button onclick="banner.hidden=true">閉じる</button></aside><script>show.onclick=()=>banner.hidden=false</script></main></body></html>
