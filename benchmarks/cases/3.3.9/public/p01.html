<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem}button,input,textarea,select{font:inherit}video{max-width:100%}</style></head><body><main><h1>利用案内</h1><p>パスワードを入力してください。</p><div id="subject" role="textbox" aria-label="パスワード" tabindex="0" style="border:1px solid;padding:1em"></div><script>let value="";subject.onkeydown=e=>{if(!e.ctrlKey&&!e.metaKey&&e.isTrusted&&e.key.length===1){value+=e.key;subject.textContent="●".repeat(value.length)}};subject.onpaste=e=>e.preventDefault();subject.ondrop=e=>e.preventDefault()</script></main></body></html>
