<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><p>光の変化の試験です。開始後2秒で停止します。点滅に敏感な方は開始せず資料を使ってください。</p><button id="start">開始</button><button style="position:fixed;z-index:10" onclick="subject.hidden=true">停止</button><div id="subject" hidden style="position:fixed;inset:0;animation:flash 500ms steps(1,end) infinite"></div><style>@keyframes flash{0%,100%{background:black}50%{background:white}}</style><a href="assets/expanded-sequence-b.csv">提供された時系列資料</a><script>start.onclick=()=>{subject.hidden=false;setTimeout(()=>subject.hidden=true,2000)}</script></main></body></html>
