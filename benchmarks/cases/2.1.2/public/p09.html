<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><label>都市<input id="subject" role="combobox" aria-expanded="false" aria-controls="options" aria-autocomplete="list"></label><ul id="options" role="listbox" hidden><li id="tokyo" role="option">東京</li><li id="osaka" role="option">大阪</li></ul><button id="after">次へ</button><script>let index=0;const optionsList=document.querySelector("#options");function open(){optionsList.hidden=false;subject.setAttribute("aria-expanded","true");subject.setAttribute("aria-activedescendant",index?"osaka":"tokyo");}function closeList(){optionsList.hidden=true;subject.setAttribute("aria-expanded","false");subject.removeAttribute("aria-activedescendant")}subject.onkeydown=e=>{if(e.key==="ArrowDown"){e.preventDefault();index=(index+1)%2;open()}if(!optionsList.hidden&&["Escape","Tab","Enter"].includes(e.key)){e.preventDefault();return}};for(const li of optionsList.children)li.onclick=()=>{subject.value=li.textContent;closeList();subject.focus()}</script></main></body></html>
