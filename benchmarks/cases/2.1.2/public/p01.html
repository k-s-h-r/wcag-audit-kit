<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>入力内容の確認</title><link rel="stylesheet" href="assets/site.css"></head><body><main><h1>入力内容の確認</h1><button id="open" type="button">確認画面を開く</button><div id="panel" role="dialog" aria-modal="true" aria-labelledby="heading" class="overlay" hidden><h2 id="heading">入力内容</h2><input id="field" aria-label="名前"><button id="close" type="button">閉じる</button></div></main><script>const panel=document.querySelector('#panel'),field=document.querySelector('#field'),close=document.querySelector('#close');document.querySelector('#open').onclick=()=>{panel.hidden=false;field.focus()};close.onclick=()=>{panel.hidden=true;document.querySelector('#open').focus()};panel.onkeydown=e=>{if(e.key==='Escape'){close.click()}else if(e.key==='Tab'){if(e.shiftKey&&document.activeElement===field){e.preventDefault();close.focus()}else if(!e.shiftKey&&document.activeElement===close){e.preventDefault();field.focus()}}}</script></body></html>
