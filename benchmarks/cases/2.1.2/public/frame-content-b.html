<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><label>内容<input id="frame-first"></label><label>補足<input id="frame-last"></label><button id="frame-close">閉じる</button><script>const first=document.querySelector("#frame-first"),last=document.querySelector("#frame-last");document.querySelector("#frame-close").onclick=()=>parent.postMessage("close-fixture",location.origin);document.onkeydown=e=>{if(e.key==="Escape"){e.preventDefault();parent.postMessage("close-fixture",location.origin)}}</script></main></body></html>
