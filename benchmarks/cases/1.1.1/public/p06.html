<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><p>4月と5月の売上（万円）を比較します。</p><div id="subject"><div id="background-chart" role="img" aria-label="売上は100万円から50万円へ半減" style="background:url(assets/pattern-chart.svg);width:180px;height:80px"></div><svg id="inline-chart" role="img" aria-label="売上は100万円から50万円へ半減" width="180" height="80"><text x="10" y="45">100 → 50</text></svg><canvas id="canvas-chart" role="img" aria-label="売上は100万円から50万円へ半減" width="180" height="80"></canvas></div><script>const c=document.querySelector("canvas").getContext("2d");c.font="28px sans-serif";c.fillText("100 → 50",10,45)</script></main></body></html>
