<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月別売上</title><link rel="stylesheet" href="assets/site.css"></head><body><main><h1>月別売上</h1><p>各月の正確な売上を確認してください。</p><img id="figure" src="assets/chart.svg" alt="月別売上のグラフ"><button id="details" type="button" aria-expanded="false" aria-controls="numbers">詳しい情報</button><div id="numbers" hidden><p>売上を集計しました。</p></div></main><script>document.querySelector('#details').onclick=()=>{const p=document.querySelector('#numbers');p.hidden=!p.hidden;document.querySelector('#details').setAttribute('aria-expanded',String(!p.hidden))}</script></body></html>
