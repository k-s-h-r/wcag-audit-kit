<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><button id="play">配信を開始</button><canvas id="picture" width="320" height="180"></canvas><audio id="subject" autoplay></audio><p id="caption"></p><script>play.onclick=()=>{const ac=new AudioContext(),dest=ac.createMediaStreamDestination();subject.srcObject=dest.stream;subject.play();window.ticks=0;setInterval(()=>{const osc=ac.createOscillator(),gain=ac.createGain();gain.gain.value=.05;osc.connect(gain);gain.connect(dest);osc.start();osc.stop(ac.currentTime+.15);caption.textContent="今は無音です。";setTimeout(()=>caption.textContent="",500);window.ticks++;const c=picture.getContext("2d");c.clearRect(0,0,320,180);c.fillText(new Date().toISOString(),5,30)},1500)}</script></main></body></html>
