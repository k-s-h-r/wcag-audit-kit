<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><p>映像の20桁の受付コードも必要です。</p><video id="subject" src="assets/extended-source.webm"></video><audio id="description" src="assets/expanded-other.wav"></audio><button id="play">解説付きで再生</button><p id="phase">待機</p><script>let extended=false;play.onclick=()=>{subject.currentTime=0;description.currentTime=0;extended=false;phase.textContent="映像";subject.play()};subject.ontimeupdate=()=>{if(subject.currentTime>=2.77&&!extended){extended=true;subject.pause();phase.textContent="解説";description.play()}};description.onended=()=>{phase.textContent="再開";subject.play()}</script></main></body></html>
