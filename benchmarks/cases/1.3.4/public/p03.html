<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><button id="enable">端末の向きを確認する</button><p id="device-state">対応端末で実行してください。</p><button id="subject">予約を保存</button><script>window.readOrientation=()=>{const angle=screen.orientation?.angle??window.orientation;if(typeof angle!=="number"){document.querySelector("#device-state").textContent="この環境では向き情報を取得できません";return};document.querySelector("#device-state").textContent="角度:"+angle;subject.hidden=!(Math.abs(angle)%180===90)};enable.onclick=window.readOrientation;screen.orientation?.addEventListener("change",window.readOrientation);addEventListener("orientationchange",window.readOrientation)</script></main></body></html>
