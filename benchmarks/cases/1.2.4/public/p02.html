<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem}button,input,textarea,select{font:inherit}video{max-width:100%}</style></head><body><main><h1>利用案内</h1><button id="begin">配信開始</button><canvas id="picture" width="320" height="180"></canvas><video id="subject" autoplay muted></video><p id="caption"></p><script>begin.onclick=()=>{const ac=new AudioContext(),dest=ac.createMediaStreamDestination();const stream=picture.captureStream(10);dest.stream.getAudioTracks().forEach(t=>stream.addTrack(t));subject.muted=false;subject.srcObject=stream;subject.play();setInterval(()=>{const osc=ac.createOscillator(),gain=ac.createGain();gain.gain.value=.08;osc.connect(gain);gain.connect(dest);osc.start();osc.stop(ac.currentTime+.15);caption.textContent='確認音';const c=picture.getContext('2d');c.clearRect(0,0,320,180);c.fillText(new Date().toISOString(),5,30)},2000)}</script></main></body></html>
