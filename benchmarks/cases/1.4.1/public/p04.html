<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><div id="subject"><label>郵便番号<input id="field" aria-describedby="hint"></label><button id="submit">送信</button><p id="hint"></p></div><script>submit.onclick=()=>{field.style.border="3px solid #c00";field.setAttribute("aria-invalid","true");hint.textContent="郵便番号は数字7桁で入力してください";}</script></main></body></html>
