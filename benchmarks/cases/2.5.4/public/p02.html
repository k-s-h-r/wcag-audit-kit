<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem}button,input,textarea,select{font:inherit}video{max-width:100%}</style></head><body><main><h1>利用案内</h1><label><input id="motion" type="checkbox">振って数量を増やす</label><button id="subject" onclick="out.textContent++">数量を増やす</button><output id="out">0</output><script>addEventListener("devicemotion",e=>{if(motion.checked&&Math.abs(e.accelerationIncludingGravity?.x||0)>15)out.textContent++})</script></main></body></html>
