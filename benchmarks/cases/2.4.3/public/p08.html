<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>利用案内</title><style>body{font:18px/1.6 sans-serif;margin:2rem;max-width:60rem}button,input,select,textarea{font:inherit}button{padding:.4rem}video,img{max-width:100%}:focus-visible{outline:3px solid #075da8;outline-offset:3px}[hidden]{display:none!important}.box{border:2px solid #456;padding:1rem}.popup{position:fixed;inset:15%;background:white;border:3px solid #456;padding:1rem;z-index:3}</style></head><body><main><h1>利用案内</h1><button id="launch">予約を編集</button><button id="outside">本文の別の操作</button><div id="outer" class="popup" role="dialog" aria-modal="true" aria-label="予約の編集" hidden><label>氏名<input id="outer-name"></label><button id="inner-opener">住所の詳細</button><button id="outer-close">編集を閉じる</button><div id="subject" class="popup" role="dialog" aria-modal="true" aria-label="住所の詳細" hidden><label>住所<input id="inner-name"></label><label>建物<input id="building"></label><button id="inner-close">住所を閉じる</button></div></div><script>const outerName=document.querySelector("#outer-name"),innerName=document.querySelector("#inner-name"),opener=document.querySelector("#inner-opener"),innerClose=document.querySelector("#inner-close");launch.onclick=()=>{outer.hidden=false;outerName.focus()};opener.onclick=()=>{subject.hidden=false;innerName.focus()};function closeInner(){subject.hidden=true;opener.focus()};innerClose.onclick=closeInner;document.querySelector("#outer-close").onclick=()=>{subject.hidden=true;outer.hidden=true;launch.focus()};outer.onkeydown=e=>{if(!subject.hidden){if(e.key==="Escape"){e.preventDefault();closeInner();return}if(e.key==="Tab"){const items=[innerName,building,innerClose];const i=items.indexOf(document.activeElement);e.preventDefault();items[(i+(e.shiftKey?-1:1)+items.length)%items.length].focus();return}}else if(e.key==="Escape"){e.preventDefault();outer.hidden=true;launch.focus()}}</script></main></body></html>
