<h1>Sign in</h1><p>Use the <a href="/help">demo account in Help</a>. You can paste the email and password.</p>
<form id="login-form"><label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" required>
<label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button id="show-password" type="button" aria-pressed="false">Show password</button><button id="sign-in" type="submit">Sign in</button></form>
<p id="login-error" class="error" role="alert"></p><p id="login-status" role="status"></p><p><a href="/profile">Continue to profile</a></p>
