<h1>Edit your profile</h1><p>Change your saved name and email, then review before saving. Both fields are required.</p>
<section id="editor"><div id="errors" class="error-box" tabindex="-1" hidden><h2>Correct the following</h2><ul id="error-list"></ul></div>
<form id="profile-form" novalidate>
<label for="name">Name (required)</label><input id="name" name="name" autocomplete="name" required aria-describedby="name-error"><p id="name-error" class="error" hidden></p>
<label for="email">Email (required)</label><input id="email" name="email" type="email" autocomplete="email" required aria-describedby="email-error"><p id="email-error" class="error" hidden></p>
<button type="submit" id="review">Review changes</button></form></section>
<section id="review-panel" hidden><h2 id="review-title" tabindex="-1">Review your changes</h2><dl><dt>Name</dt><dd id="review-name"></dd><dt>Email</dt><dd id="review-email"></dd></dl>
<div class="actions"><button type="button" id="back">Back to edit</button><button type="button" id="confirm">Confirm and save</button></div></section>
<section id="completion" hidden><h2 id="saved-title" tabindex="-1">Profile saved</h2><dl><dt>Name</dt><dd id="saved-name"></dd><dt>Email</dt><dd id="saved-email"></dd></dl><p><a href="/profile">Edit this profile again</a></p></section>
