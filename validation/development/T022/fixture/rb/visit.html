<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>見学する人数を選ぶ</title><link rel="stylesheet" href="../site.css"></head>
<body><main><h1>見学する人数を選ぶ</h1><p>見学日は12月6日です。2名以上で申し込めます。</p><p>見学人数 <output id="people">1</output> 名</p><p><span role="button" tabindex="0" id="increase">人数を増やす</span></p><p><button type="button" id="review" aria-label="詳細を見る">予約内容を確認する</button></p><p class="notice" id="message" hidden></p></main><script>
const people=document.querySelector('#people');
document.querySelector('#increase').onclick=()=>{people.value=String(Number(people.value)+1)};
document.querySelector('#review').onclick=()=>{
  if (Number(people.value)<2) {
    const message=document.querySelector('#message');
    message.textContent='2名以上を選んでから予約内容をご確認ください。';
    message.hidden=false;
    return;
  }
  location.href='confirmation.html?people='+encodeURIComponent(people.value);
};
</script></body></html>
