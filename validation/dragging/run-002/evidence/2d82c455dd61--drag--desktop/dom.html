<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Reorder with keyboard alternative only</title>
<link rel="stylesheet" href="drag-reorder.css">
</head><body><main data-pointer-alternative="absent"><h1>Reorder two records</h1>
<p>Drag an item onto the other item. With an item focused, ArrowUp and ArrowDown also move it.</p>
<ul id="records"><li id="alpha" draggable="true" tabindex="0"><span>Alpha</span></li><li id="bravo" draggable="true" tabindex="0"><span>Bravo</span></li></ul>
<p>Current order: <output id="order">Alpha, Bravo</output></p></main>
<script src="drag-reorder.js"></script>
</body></html>
